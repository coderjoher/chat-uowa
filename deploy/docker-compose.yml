# UOWA Chat: the official Rocket.Chat image with UOWA branding, MongoDB, and Caddy for HTTPS.
# Setup and day-to-day operation: README.md in this folder.

services:
  mongodb:
    image: mongo:${MONGO_VERSION:-8.0}
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all', '--quiet']
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      # Rocket.Chat needs a replica set; the first check creates it.
      test: >-
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }).ok }"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  # The uploads volume starts out owned by root; Rocket.Chat runs as its own user.
  uploads-permissions:
    image: registry.rocket.chat/rocketchat/rocket.chat:${RELEASE:-8.9.0}
    user: root
    entrypoint: ['chown', '-R', 'rocketchat:rocketchat', '/app/uploads']
    restart: 'no'
    volumes:
      - rocketchat-uploads:/app/uploads

  rocketchat:
    image: registry.rocket.chat/rocketchat/rocket.chat:${RELEASE:-8.9.0}
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      uploads-permissions:
        condition: service_completed_successfully
    environment:
      ROOT_URL: https://${DOMAIN:-localhost}
      PORT: 3000
      MONGO_URL: mongodb://mongodb:27017/rocketchat?replicaSet=rs0
      DEPLOY_METHOD: docker
      # Starting values only: the admin dashboard can change them later.
      Site_Name: UOWA Chat
      Language: ${LANGUAGE:-en}
      FileUpload_Storage_Type: FileSystem
      FileUpload_FileSystemPath: /app/uploads
    volumes:
      - rocketchat-uploads:/app/uploads
      # UOWA name and icons for the installable web app, favicons and default logos.
      - ../apps/meteor/public/images/logo:/app/bundle/programs/web.browser/app/images/logo:ro
      - ../apps/meteor/public/images/manifest.json:/app/bundle/programs/web.browser/app/images/manifest.json:ro
      - ../apps/meteor/public/images/browserconfig.xml:/app/bundle/programs/web.browser/app/images/browserconfig.xml:ro
      - ../apps/meteor/public/favicon.ico:/app/bundle/programs/web.browser/app/favicon.ico:ro
    expose:
      - '3000'

  caddy:
    image: caddy:${CADDY_VERSION:-2.10}
    restart: unless-stopped
    depends_on:
      - rocketchat
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mongodb-data:
  rocketchat-uploads:
  caddy-data:
  caddy-config:
